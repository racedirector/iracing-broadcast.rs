[workspace]
members = [
  "crates/iracing-broadcast",
  "crates/iracing-broadcast-wasm",
  "crates/iracing-broadcast-node",
]
resolver = "3"

[workspace.package]
authors = ["Justin Makaila <justin@treehousetechnology.io>"]
repository = "https://github.com/racedirector/iracing-broadcast.rs"
license = "MIT"
edition = "2024"

[workspace.dependencies]
bitflags = "2.10"
thiserror = "2"
windows = { version = "0.62.2", features = ["Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_extern_crates = "warn"
unused_imports = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"

